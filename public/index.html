<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Amour & Cie</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        135deg,
        #ff4458,
        #ff6b81,
        #ff8e53
    );
}

.container{
    width:100%;
    max-width:420px;
    padding:20px;
}

.card{
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    color:#ff4458;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.active{
    background:#ff4458;
    color:white;
}

.inactive{
    background:#eeeeee;
}

.form{
    display:flex;
    flex-direction:column;
    gap:10px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    resize:none;
}

.submit{
    background:#ff4458;
    color:white;
    border:none;
    padding:14px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

.submit:hover{
    background:#e63950;
}

.hidden{
    display:none;
}

#status{
    margin-top:15px;
    text-align:center;
    color:green;
}

.photo-preview{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#eee;
    margin:auto;
    background-size:cover;
    background-position:center;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<div class="logo">
<h1>🌹 Amour & Cie</h1>
<p>Trouvez votre moitié</p>
</div>

<div class="tabs">

<button id="btnLogin"
class="active"
onclick="showLogin()">
Connexion
</button>

<button id="btnRegister"
class="inactive"
onclick="showRegister()">
Inscription
</button>

</div>

<!-- CONNEXION -->

<div id="loginView">

<div class="form">

<input
type="email"
id="loginEmail"
placeholder="Adresse email">

<input
type="password"
id="loginPassword"
placeholder="Mot de passe">

<button
class="submit"
onclick="login()">
Se connecter
</button>

</div>

</div>

<!-- INSCRIPTION -->

<div id="registerView" class="hidden">

<div class="form">

<div
class="photo-preview"
id="preview">
</div>

<input
type="file"
accept="image/*"
onchange="previewPhoto(event)">

<input
type="text"
id="name"
placeholder="Prénom">

<input
type="email"
id="email"
placeholder="Adresse email">

<input
type="password"
id="password"
placeholder="Mot de passe">

<input
type="password"
id="confirmPassword"
placeholder="Confirmation mot de passe">

<input
type="number"
id="age"
placeholder="Âge">

<input
type="text"
id="city"
placeholder="Ville">

<select id="gender">
<option value="homme">👨 Homme</option>
<option value="femme">👩 Femme</option>
</select>

<select id="lookingFor">
<option value="femme">👩 Recherche femme</option>
<option value="homme">👨 Recherche homme</option>
</select>

<textarea
id="bio"
rows="3"
placeholder="Votre description">
</textarea>

<button
class="submit"
onclick="register()">
Créer mon compte
</button>

</div>

</div>

<div id="status"></div>

</div>

</div>

<script>

function showLogin(){

document.getElementById("loginView")
.classList.remove("hidden");

document.getElementById("registerView")
.classList.add("hidden");

btnLogin.className="active";
btnRegister.className="inactive";

}

function showRegister(){

document.getElementById("registerView")
.classList.remove("hidden");

document.getElementById("loginView")
.classList.add("hidden");

btnRegister.className="active";
btnLogin.className="inactive";

}

function previewPhoto(event){

const file =
event.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload=function(e){

document.getElementById("preview")
.style.backgroundImage=
`url('${e.target.result}')`;

}

reader.readAsDataURL(file);

}

async function register(){

const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirmPassword").value;

if(password !== confirm){

alert(
"Les mots de passe ne correspondent pas."
);

return;

}

const response =
await fetch("/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:
document.getElementById("name").value,

email:
document.getElementById("email").value,

password:
password,

age:
document.getElementById("age").value,

city:
document.getElementById("city").value,

gender:
document.getElementById("gender").value,

lookingFor:
document.getElementById("lookingFor").value,

bio:
document.getElementById("bio").value

})

});

const data =
await response.json();

document.getElementById("status")
.innerText =
data.message ||
"Compte créé";

}

async function login(){

const response =
await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:
document.getElementById("loginEmail").value,

password:
document.getElementById("loginPassword").value

})

});

const data =
await response.json();

if(data.success){

localStorage.setItem(
"user",
JSON.stringify(data)
);

alert("Connexion réussie !");

}else{

alert(
data.message ||
"Connexion impossible"
);

}

}

</script>

</body>
</html>
