<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amour & Cie - Rencontres</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #e8e3dd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 20px;
      color: #c85a38;
    }

    .badge {
      font-size: 12px;
      color: #2b7a78;
      font-weight: 600;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      color: #c85a38;
      margin-bottom: 20px;
    }

    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #c85a38;
      margin-bottom: 12px;
      background-color: #f0f0f0;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-photo {
      background-color: #558b6e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background-color: #fafafa;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .btn-gps {
      background-color: #558b6e;
      color: white;
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    textarea {
      resize: none;
      height: 70px;
    }

    .btn-submit {
      width: 100%;
      background-color: #c85a38;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #b04e30;
    }

    #status-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="logo">🌷 Amour & Cie</div>
      <span class="badge">Standard</span>
    </div>

    <h1>Créer votre profil</h1>

    <div class="avatar-container">
      <div class="avatar-wrapper">
        <img id="avatar-preview" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=300&auto=format&fit=crop" alt="Photo de profil">
      </div>
      <button class="btn-photo" onclick="document.getElementById('photo-input').click()">🖼️ Choisir une photo</button>
      <input type="file" id="photo-input" accept="image/*" style="display: none;">
    </div>

    <form id="profile-form">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Votre prénom..." required>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Âge</label>
          <input type="number" id="age" placeholder="Ex: 25" required>
        </div>
        <div class="form-group">
          <label>Ville / Localisation</label>
          <div style="display: flex; gap: 6px;">
            <input type="text" id="ville" placeholder="Votre ville" required>
            <button type="button" class="btn-gps" id="btn-gps">📍 GPS</button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Je suis :</label>
          <select id="genre">
            <option value="Homme">Un Homme</option>
            <option value="Femme">Une Femme</option>
          </select>
        </div>
        <div class="form-group">
          <label>Je cherche :</label>
          <select id="recherche">
            <option value="Femme">Une Femme</option>
            <option value="Homme">Un Homme</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Bio / Description</label>
        <textarea id="bio" placeholder="Décrivez-vous en quelques mots..."></textarea>
      </div>

      <button type="submit" class="btn-submit">Rejoindre l'application</button>
      <div id="status-msg"></div>
    </form>
  </div>

  <script>
    // 1. Gestion du chargement de photo
    const photoInput = document.getElementById('photo-input');
    const avatarPreview = document.getElementById('avatar-preview');

    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          avatarPreview.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 2. Localisation GPS automatique
    const btnGps = document.getElementById('btn-gps');
    const villeInput = document.getElementById('ville');

    btnGps.addEventListener('click', function() {
      if ('geolocation' in navigator) {
        btnGps.textContent = '⏳...';
        navigator.geolocation.getCurrentPosition(
          async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
              const data = await res.json();
              const ville = data.address.city || data.address.town || data.address.village || 'Position détectée';
              villeInput.value = ville;
              btnGps.textContent = '📍 GPS';
            } catch (err) {
              villeInput.value = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
              btnGps.textContent = '📍 GPS';
            }
          },
          function(error) {
            alert('Impossible de récupérer votre position GPS. Veuillez vérifier les autorisations de votre navigateur.');
            btnGps.textContent = '📍 GPS';
          }
        );
      } else {
        alert('La géolocalisation n\'est pas supportée par votre navigateur.');
      }
    });

    // 3. Soumission du formulaire et connexion
    const form = document.getElementById('profile-form');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const userProfile = {
        prenom: document.getElementById('prenom').value,
        age: document.getElementById('age').value,
        ville: document.getElementById('ville').value,
        genre: document.getElementById('genre').value,
        recherche: document.getElementById('recherche').value,
        bio: document.getElementById('bio').value,
        photo: avatarPreview.src
      };

      // Sauvegarde du profil en mémoire locale
      localStorage.setItem('userProfile', JSON.stringify(userProfile));

      statusMsg.style.color = '#558b6e';
      statusMsg.textContent = 'Connexion en cours... Profil créé avec succès !';

      // Redirection après validation
      setTimeout(() => {
        alert('Bienvenue ' + userProfile.prenom + ' ! Vous êtes maintenant connecté à Amour & Cie.');
      }, 500);
    });
  </script>
</body>
</html>
