<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amour & Cie</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;}
:root{--rose:#ff4d6d;--rose2:#ff8a5c;--ink:#1f2330;--grey:#8a8f9c;--line:#ececf1;}

body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 10%,#ffe3e8 0,transparent 45%),
             radial-gradient(circle at 90% 90%,#ffe9d9 0,transparent 45%),#fff7f8;
  color:var(--ink);
}
.container{width:100%;max-width:430px;height:min(780px,100vh);padding:10px;display:flex;}
.card{
  background:#fff;border-radius:28px;padding:24px 22px 16px;width:100%;
  box-shadow:0 25px 60px rgba(255,77,109,.18);display:flex;flex-direction:column;overflow:hidden;
}

  
/* Logo */
.logo{text-align:center;margin-bottom:16px;}
.logo h1{
  font-size:28px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--rose),var(--rose2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo p{color:var(--grey);font-size:13px;margin-top:2px;}

/* Onglets connexion / inscription */
.tabs{display:flex;background:#f4f4f7;border-radius:14px;padding:4px;margin-bottom:16px;}
.tabs button{
  flex:1;padding:10px;border:none;border-radius:11px;background:transparent;
  font-weight:600;font-size:14px;color:var(--grey);cursor:pointer;transition:.2s;
}
.tabs button.on{background:#fff;color:var(--rose);box-shadow:0 2px 8px rgba(0,0,0,.08);}

/* Formulaires */
.form{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;padding:2px 2px 10px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--grey);margin:0 0 5px 4px;}
input,select,textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;
  font-size:14px;background:#fafafc;color:var(--ink);outline:none;transition:.15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--rose);background:#fff;box-shadow:0 0 0 4px rgba(255,77,109,.1);}
textarea{resize:none;}
.row{display:flex;gap:10px;}
.row .field{flex:1;}

.submit{
  background:linear-gradient(90deg,var(--rose),var(--rose2));color:#fff;border:none;
  padding:14px;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 20px rgba(255,77,109,.3);transition:.15s;
}
.submit:hover{transform:translateY(-1px);}
.btn-small{padding:0 14px;border-radius:14px;font-size:13px;white-space:nowrap;box-shadow:none;}

.hidden{display:none !important;}
#status{text-align:center;color:var(--rose);font-size:13px;min-height:18px;margin-top:6px;}

/* Photo de profil */
.avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.avatar{
  width:110px;height:110px;border-radius:50%;background:#f1f1f5 center/cover no-repeat;
  border:4px solid #fff;box-shadow:0 0 0 3px var(--rose),0 8px 20px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;font-size:36px;color:#c3c5ce;
  cursor:pointer;position:relative;
}
.avatar .cam{
  position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;
  background:var(--rose);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;
  border:3px solid #fff;
}
.avatar-hint{font-size:12px;color:var(--grey);}

/* Panneaux de l'app */
.view-panel{display:none;flex-direction:column;flex:1;overflow-y:auto;}
.view-panel.active{display:flex;}

/* Swipe */
.swipe-card{
  flex:1;border-radius:24px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 12px 30px rgba(0,0,0,.15);background:#222;
}
.photo-container{
  flex:1;background:linear-gradient(135deg,#ffd1d9,#ffe3cf) center/cover no-repeat;
  display:flex;align-items:flex-end;padding:20px;min-height:300px;position:relative;
}
.photo-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%);}
.profile-info{position:relative;z-index:2;color:#fff;width:100%;}
.profile-name{font-size:26px;font-weight:800;}
.profile-city{font-size:13px;opacity:.9;margin-top:2px;}
.profile-bio{font-size:13px;opacity:.95;margin-top:8px;line-height:1.4;}
.swipe-actions{display:flex;justify-content:center;gap:28px;padding:14px 0 4px;}
.action-btn{
  width:62px;height:62px;border-radius:50%;border:none;font-size:26px;cursor:pointer;
  background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.14);transition:.15s;
}
.action-btn:hover{transform:scale(1.08);}
.btn-pass{color:#ff5a5f;}
.btn-like{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;}

/* Chat */
.panel-title{font-size:18px;font-weight:800;margin-bottom:10px;}
#match-list{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px;}
.match-chip{
  border:none;background:#fff0f3;color:var(--rose);font-weight:600;font-size:13px;
  padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
}
.chat-box{
  flex:1;border-radius:18px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;
  gap:8px;background:#f7f7fa;margin-bottom:10px;
}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.35;word-break:break-word;}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border-bottom-right-radius:4px;}
.msg.other{align-self:flex-start;background:#fff;color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.msg-author{font-size:10px;opacity:.75;margin-bottom:2px;font-weight:700;}
.chat-input{display:flex;gap:8px;}

/* Profil */
#view-profile{align-items:center;text-align:center;justify-content:center;gap:6px;}
#view-profile .avatar{cursor:default;width:130px;height:130px;margin-bottom:10px;}
#profile-name-view{font-size:24px;font-weight:800;}
#profile-details-view{color:var(--grey);font-size:14px;font-weight:600;}
#profile-city-view{color:var(--rose);font-size:14px;font-weight:700;}
#profile-bio-view{color:#555;font-size:13px;font-style:italic;background:#f7f7fa;padding:12px;border-radius:14px;width:100%;margin:12px 0 20px;}
.logout{background:#f4f4f7;color:#e5484d;box-shadow:none;width:100%;max-width:220px;}

/* Barre du bas */
.bottom-nav{display:flex;border-top:1px solid var(--line);padding-top:8px;margin-top:10px;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--grey);cursor:pointer;gap:2px;}
.nav-item.active{color:var(--rose);font-weight:700;}
.nav-icon{font-size:20px;}

/* Messages vocaux et appels */
.icon-btn{border:none;background:#fff0f3;color:var(--rose);width:44px;height:44px;border-radius:14px;font-size:18px;cursor:pointer;}
.icon-btn.rec{background:#e5484d;color:#fff;animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.6}}
.chat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.chat-head .panel-title{margin:0;}
.chat-head .btns{display:flex;gap:6px;}
audio{max-width:220px;height:36px;}
#callOverlay{position:fixed;inset:0;background:#111;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;}
#callOverlay.on{display:flex;}
#remoteVideo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
#localVideo{position:absolute;right:16px;top:16px;width:110px;border-radius:14px;border:2px solid #fff;z-index:2;background:#000;}
#callText{position:absolute;top:24px;left:0;right:0;text-align:center;color:#fff;font-weight:700;z-index:2;text-shadow:0 1px 6px #000;}
.call-actions{position:absolute;bottom:40px;display:flex;gap:20px;z-index:2;}
.call-actions button{width:64px;height:64px;border-radius:50%;border:none;font-size:26px;cursor:pointer;color:#fff;}
.red{background:#e5484d;}
.green{background:#2ecc71;}
#incoming{position:fixed;left:0;right:0;top:20px;margin:auto;width:min(340px,92vw);background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:16px;z-index:60;display:none;text-align:center;}
#incoming.on{display:block;}
#incoming .call-actions{position:static;justify-content:center;margin-top:12px;}

</style>
</head>
<body>
<div class="container">
<div class="card">

<img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800&auto=format&fit=crop&q=80" alt="Amour & Cie" style="width: calc(100% + 48px); margin: -24px -24px 20px -24px; object-fit: cover; height: 220px;">
  
  <div class="logo">
    <h1>🌹 Amour & Cie</h1>
    <p>Trouvez votre moitié</p>
  </div>

  <!-- AUTHENTIFICATION -->
  <div id="authContainer" class="view-panel active">
    <div class="tabs">
      <button id="btnLoginTab" class="on" onclick="showLogin()">Connexion</button>
      <button id="btnRegisterTab" onclick="showRegister()">Inscription</button>
    </div>

        <div id="loginView" class="form">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="vous@exemple.com" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"></div>
      <button class="submit" onclick="login()">Se connecter</button>
    </div>



    <div id="registerView" class="form hidden">
      <div class="avatar-wrap">
        <div class="avatar" id="preview" onclick="document.getElementById('photoInput').click()">
          <span id="preview-icon">👤</span><div class="cam">📷</div>
        </div>
        <span class="avatar-hint">Touchez pour ajouter votre photo</span>
        <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="previewPhoto(event)">
      </div>

      <div class="field"><label>Prénom</label><input type="text" id="name" placeholder="Votre prénom"></div>
      <div class="field"><label>Email</label><input type="email" id="email" placeholder="vous@exemple.com"></div>
      <div class="row">
        <div class="field"><label>Mot de passe</label><input type="password" id="password" placeholder="6 caractères min."></div>
        <div class="field"><label>Confirmation</label><input type="password" id="confirmPassword" placeholder="Répétez"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:.6"><label>Âge</label><input type="number" id="age" placeholder="18+" min="18"></div>
        <div class="field">
          <label>Ville</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="city" placeholder="Votre ville">
            <button type="button" class="submit btn-small" onclick="obtenirGeolocalisation()">📍</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Je suis</label>
          <select id="gender"><option value="homme">Un homme</option><option value="femme">Une femme</option></select>
        </div>
        <div class="field"><label>Je cherche</label>
          <select id="lookingFor"><option value="femme">Une femme</option><option value="homme">Un homme</option></select>
        </div>
      </div>
      <div class="field"><label>À propos de vous</label><textarea id="bio" rows="3" placeholder="Parlez un peu de vous..."></textarea></div>
      <button class="submit" onclick="register()">Créer mon compte</button>
    </div>
  </div>

  <!-- SWIPE -->
  <div id="view-swipe" class="view-panel">
    <div class="swipe-card">
      <div id="card-photo" class="photo-container">
        <div class="photo-overlay"></div>
        <div class="profile-info">
          <div class="profile-name"><span id="card-name">Recherche...</span>, <span id="card-age">--</span></div>
          <div class="profile-city">📍 <span id="card-city">--</span></div>
          <div class="profile-bio" id="card-bio">En attente d'autres célibataires...</div>
        </div>
      </div>
    </div>
    <div class="swipe-actions">
      <button type="button" class="action-btn btn-pass" onclick="swiperProfil(false)">✕</button>
      <button type="button" class="action-btn btn-like" onclick="swiperProfil(true)">♥</button>
    </div>

        <div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:#8a8f9c;">
      <span>Périmètre</span>
      <input type="range" id="radius" min="5" max="200" value="100" step="5" style="flex:1" oninput="document.getElementById('radiusLabel').innerText=this.value+' km'" onchange="loadProfiles()">
      <b id="radiusLabel" style="color:#ff4d6d">100 km</b>
    </div>

  </div>

  <!-- CHAT -->
  <div id="view-chat" class="view-panel">
        <div class="chat-head">
      <div class="panel-title">Messages</div>
      <div class="btns">
        <button class="icon-btn" title="Appel audio" onclick="startCall(false)">📞</button>
        <button class="icon-btn" title="Appel vidéo" onclick="startCall(true)">🎥</button>
      </div>
    </div>

    <div id="match-list"></div>
    <div class="chat-box" id="chat-messages">
      <div class="msg other"><div class="msg-author">Système</div>Choisissez un match pour discuter !</div>
    </div>
    <div class="chat-input">
            <button type="button" class="icon-btn" id="mic-btn" title="Message vocal" onclick="toggleRecord()">🎤</button>
      <input type="text" id="msg-input" placeholder="Votre message..." onkeypress="handleKeyPress(event)">

      <button type="button" class="submit btn-small" style="padding:0 18px" onclick="sendMessage()">Envoyer</button>
    </div>
  </div>

  <!-- QUI M'A LIKÉ -->
  <div id="view-likes" class="view-panel">
    <div class="panel-title">Ils vous ont liké</div>
    <div id="likes-list" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;"></div>
  </div>


  <!-- PROFIL -->
  <div id="view-profile" class="view-panel">
    <div class="avatar" id="profile-photo-view"><span>👤</span></div>
    <h2 id="profile-name-view"></h2>
    <p id="profile-details-view"></p>
    <p id="profile-city-view"></p>
    <p id="profile-bio-view"></p>
    <button class="submit logout" onclick="deconnecter()">Se déconnecter</button>
  </div>
    <div id="callOverlay">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="callText"></div>
    <div class="call-actions"><button class="red" onclick="endCall(true)">📵</button></div>
  </div>
  <div id="incoming">
    <div id="incomingText" style="font-weight:700"></div>
    <div class="call-actions">
      <button class="red" onclick="rejectCall()">✕</button>
      <button class="green" onclick="acceptCall()">✔</button>
    </div>
  </div>


  <div id="status"></div>

  <div class="bottom-nav" id="bottom-nav" style="display:none;">
    <div class="nav-item active" id="nav-swipe" onclick="switchTab('swipe', this)"><div class="nav-icon">🔥</div><span>Découvrir</span></div>
    <div class="nav-item" id="nav-chat" onclick="switchTab('chat', this)"><div class="nav-icon">💬</div><span>Messages</span></div>
    <div class="nav-item" id="nav-profile" onclick="switchTab('profile', this)"><div class="nav-icon">👤</div><span>Profil</span></div>
        <div class="nav-item" id="nav-likes" onclick="openLikes(this)"><div class="nav-icon">💖</div><span>Likes</span></div>

  </div>

</div>
</div>

<script>
let socket = null;
let token = localStorage.getItem("token") || "";
let me = null;
let userPhotoBase64 = "";
let profiles = [];
let idx = 0;
let matchesList = [];
let currentMatch = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const api = async (url, method = "GET", body) => {
  const res = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", ...(token && { Authorization: "Bearer " + token }) },
    body: body ? JSON.stringify(body) : undefined
  });
  return res.json();
};

function showLogin() {
  $("loginView").classList.remove("hidden");
  $("registerView").classList.add("hidden");
  $("btnLoginTab").classList.add("on");
  $("btnRegisterTab").classList.remove("on");
}
function showRegister() {
  $("registerView").classList.remove("hidden");
  $("loginView").classList.add("hidden");
  $("btnRegisterTab").classList.add("on");
  $("btnLoginTab").classList.remove("on");
}

function setAvatar(el, photo) {
  if (photo) {
    el.style.backgroundImage = "url('" + photo + "')";
    const span = el.querySelector("span");
    if (span) span.style.display = "none";
  }
}

function previewPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 600, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * r; c.height = img.height * r;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      userPhotoBase64 = c.toDataURL("image/jpeg", 0.8);
      setAvatar($("preview"), userPhotoBase64);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function register() {
  const password = $("password").value;
  if (password !== $("confirmPassword").value) return alert("Les mots de passe ne correspondent pas.");
  const data = await api("/register", "POST", {
    name: $("name").value, email: $("email").value, password,
    age: $("age").value, city: $("city").value, gender: $("gender").value,
        lookingFor: $("lookingFor").value, bio: $("bio").value, photo: userPhotoBase64,
    lat: window.userLat || null, lon: window.userLon || null

  });
  if (!data.success) return alert(data.message);
  startApp(data);
}

async function login() {
  const data = await api("/login", "POST", {
    email: $("loginEmail").value, password: $("loginPassword").value
  });
  if (!data.success) return alert(data.message);
  startApp(data);
}

function startApp(data) {
  token = data.token;
  me = data.user;
  localStorage.setItem("token", token);

  $("profile-name-view").innerText = me.name;
  $("profile-details-view").innerText = me.age + " ans • " + me.gender;
  $("profile-city-view").innerText = "📍 " + (me.city || "");
  $("profile-bio-view").innerText = me.bio ? "\u201C" + me.bio + "\u201D" : "Aucune bio";
  setAvatar($("profile-photo-view"), me.photo);

  $("authContainer").style.display = "none";
  $("bottom-nav").style.display = "flex";
  switchTab("swipe", $("nav-swipe"));

  connectSocket();
  loadProfiles();
  loadMatches();
}

function connectSocket() {
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });

  socket.on("receive_message", msg => {
    if (currentMatch && msg.matchId === currentMatch.matchId) addMessage(msg);
    else if (msg.author !== me.id) toast("💬 Nouveau message de " + msg.authorName);
  });
  socket.on("match_success", async data => {
    alert("🎉 C'est un Match avec " + data.user.name + " !");
    await loadMatches();
    openMatch(data.matchId);
    switchTab("chat", $("nav-chat"));
  });
    socket.on("receive_like_notification", d => {
    toast("💖 " + d.senderName + " vous a liké !");
    const box = $("toastbox");
    if (box && box.lastChild) {
      box.lastChild.style.cursor = "pointer";
      box.lastChild.onclick = () => {
        box.lastChild.remove();
        openLikes($("nav-likes"));
      };
    }
  });


  socket.on("error_message", d => alert(d.message));
  socket.on("connect_error", () => deconnecter());
}

function toast(text) {
  $("status").innerText = text;
  setTimeout(() => ($("status").innerText = ""), 4000);
}

function switchTab(name, el) {
  document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  $("view-" + name).classList.add("active");
      if (el) el.classList.add("active");
}

async function openLikes(el) {


  switchTab("likes", el);
  const data = await api("/likes");
  const list = Array.isArray(data) ? data : [];
  if (!list.length) {
    $("likes-list").innerHTML = '<p style="color:#8a8f9c;font-size:13px">Personne pour le moment. Revenez plus tard !</p>';
    return;
  }
  $("likes-list").innerHTML = list.map(u =>
    '<div style="display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 14px rgba(0,0,0,.06)">' +
      '<div style="width:52px;height:52px;border-radius:50%;background:#f1f1f5 center/cover no-repeat;background-image:url(\'' + (u.photo || "") + '\')"></div>' +
      '<div style="flex:1"><b>' + esc(u.name) + ', ' + esc(u.age) + '</b>' +
      '<div style="font-size:12px;color:#8a8f9c">📍 ' + esc(u.city || "") + '</div></div>' +
      '<button class="submit btn-small" style="padding:10px 14px" onclick="likeBack(\'' + u.id + '\')">♥</button>' +
    '</div>').join("");
}

function likeBack(targetId) {
  socket.emit("send_like", { targetId });
  toast("💖 Like envoyé !");
  setTimeout(() => openLikes($("nav-likes")), 400);
}



function deconnecter() {
  localStorage.removeItem("token");
  token = ""; me = null; currentMatch = null;
  if (socket) socket.disconnect();
  $("bottom-nav").style.display = "none";
  $("authContainer").style.display = "flex";
  document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
  $("authContainer").classList.add("active");
  showLogin();
}

// ----- Swipe -----
async function loadProfiles() {
  const r = Number($("radius").value || 100);
  const data = await api("/discover?radius=" + r);
  profiles = Array.isArray(data) ? data : [];
  idx = 0;
  showProfile();
}


function showProfile() {
  const photo = $("card-photo");
  if (idx >= profiles.length) {
    $("card-name").innerText = "Plus de profils";
    $("card-age").innerText = "--";
    $("card-city").innerText = "Revenez plus tard";
    $("card-bio").innerText = "Aucun autre profil pour le moment.";
    photo.style.backgroundImage = "";
    return;
  }


  const p = profiles[idx];
  $("card-name").innerText = p.name;
  $("card-age").innerText = p.age;
  $("card-city").innerText = p.city || "";
  $("card-bio").innerText = p.bio || "Pas de description.";
  photo.style.backgroundImage = p.photo ? "url('" + p.photo + "')" : "";
}

function swiperProfil(isLike) {
  if (idx >= profiles.length) return;
  socket.emit(isLike ? "send_like" : "send_pass", { targetId: profiles[idx].id });
  idx++;
  showProfile();
}

// ----- Matchs & chat -----
async function loadMatches() {
  const data = await api("/matches");
  matchesList = Array.isArray(data) ? data : [];
  $("match-list").innerHTML = matchesList.map(m =>
    '<button class="match-chip" onclick="openMatch(\'' + esc(m.matchId) + '\')">' + esc(m.user.name) + '</button>').join("");
}

async function openMatch(matchId) {
  currentMatch = matchesList.find(m => m.matchId === matchId);
  if (!currentMatch) return;
  $("chat-messages").innerHTML = "";
  const history = await api("/messages/" + matchId);
  if (Array.isArray(history)) history.forEach(addMessage);
}

function addMessage(msg) {
  const div = document.createElement("div");
  div.className = "msg " + (msg.author === me.id ? "me" : "other");
  div.innerHTML = '<div class="msg-author">' + esc(msg.authorName) + '</div>' + esc(msg.text);
  $("chat-messages").appendChild(div);
  $("chat-messages").scrollTop = $("chat-messages").scrollHeight;
}

function sendMessage() {
  const text = $("msg-input").value.trim();
  if (!text) return;
  if (!currentMatch) return alert("Choisissez d'abord un match.");
  socket.emit("send_message", { matchId: currentMatch.matchId, text });
  $("msg-input").value = "";
}
function handleKeyPress(e) { if (e.key === "Enter") sendMessage(); }

function obtenirGeolocalisation() {
  if (!navigator.geolocation) return alert("Géolocalisation non prise en charge.");
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
        window.userLat = lat;
    window.userLon = lon;

    const base = "https://" + "nominatim" + ".openstreetmap" + ".org/reverse?format=json";
    const url = base + "&lat=" + lat + "&lon=" + lon;
    try {
      const r = await fetch(url);
      const d = await r.json();
      $("city").value = d.address.city || d.address.town || d.address.village || "Ma ville";
    } catch (e) {
      $("city").value = lat.toFixed(2) + ", " + lon.toFixed(2);
    }
  }, () => alert("Impossible de récupérer la position GPS."));
}

(async () => {
  if (!token) return;
  try {
    const data = await api("/me");
    if (data.success) startApp({ token, user: data.user });
    else deconnecter();
  } catch (e) { deconnecter(); }
})();
