<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amour & Cie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #e8e3dd; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { font-weight: 700; font-size: 20px; color: #c85a38; }
    .badge { font-size: 12px; background: #f0f0f0; padding: 4px 10px; border-radius: 12px; font-weight: 600; color: #555; }
    
    .avatar-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; }
    .avatar-wrapper { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 3px solid #c85a38; margin-bottom: 10px; cursor: pointer; background: #eee; }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-secondary { background-color: #558b6e; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }
    
    .btn-main { width: 100%; background-color: #c85a38; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-main:hover { background-color: #b04e30; }
    
    .nav-toggle { text-align: center; margin-top: 12px; font-size: 13px; color: #558b6e; cursor: pointer; text-decoration: underline; font-weight: 600; }
    
    /* Interface Swipe */
    #app-screen { display: none; }
    .profile-card { position: relative; width: 100%; height: 360px; border-radius: 16px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
    .profile-card img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: white; padding: 15px; }
    
    .actions { display: flex; justify-content: center; gap: 20px; }
    .btn-act { width: 55px; height: 55px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    .btn-no { background: #fff; color: #ff4d4d; }
    .btn-yes { background: #2b7a78; color: white; }
    .btn-logout { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; text-decoration: underline; margin-top: 15px; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="logo">🌷 Amour & Cie</div>
      <div id="quota-tag" class="badge" style="display:none;"></div>
    </div>

    <!-- ÉCRAN CONNEXION / INSCRIPTION -->
    <div id="auth-screen">
      <h2 id="auth-title" style="text-align:center; color:#c85a38; margin-bottom:15px; font-size:18px;">Connexion à votre compte</h2>

      <!-- Formulaire Connexion -->
      <form id="login-form">
        <div class="form-group">
          <label>Votre Prénom</label>
          <input type="text" id="login-prenom" placeholder="Saisissez votre prénom..." required>
        </div>
        <button type="submit" class="btn-main">Se connecter</button>
        <div class="nav-toggle" onclick="toggleAuth(true)">Pas encore de compte ? S'inscrire</div>
      </form>

      <!-- Formulaire Inscription -->
      <form id="register-form" style="display:none;">
        <div class="avatar-container">
          <div class="avatar-wrapper" onclick="document.getElementById('photo-file').click()">
            <img id="avatar-img" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=300" alt="Photo">
          </div>
          <button type="button" class="btn-secondary" onclick="document.getElementById('photo-file').click()">🖼️ Importer une photo</button>
          <input type="file" id="photo-file" accept="image/*" style="display:none;">
        </div>

        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="reg-prenom" placeholder="Votre prénom..." required>
        </div>

        <div class="row">
          <div class="form-group">
            <label>Âge</label>
            <input type="number" id="reg-age" placeholder="Ex: 25" required>
          </div>
          <div class="form-group">
            <label>Ville</label>
            <div style="display:flex; gap:4px;">
              <input type="text" id="reg-ville" placeholder="Ville" required>
              <button type="button" class="btn-secondary" id="btn-gps">📍</button>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>Je suis :</label>
            <select id="reg-genre">
              <option value="Homme">Un Homme</option>
              <option value="Femme">Une Femme</option>
            </select>
          </div>
          <div class="form-group">
            <label>Je cherche :</label>
            <select id="reg-recherche">
              <option value="Femme">Une Femme</option>
              <option value="Homme">Un Homme</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-main">Créer mon compte</button>
        <div class="nav-toggle" onclick="toggleAuth(false)">Déjà inscrit ? Se connecter</div>
      </form>
    </div>

    <!-- ÉCRAN DE L'APPLICATION (SWIPE/LIKES) -->
    <div id="app-screen">
      <div class="profile-card">
        <img id="target-img" src="" alt="Photo">
        <div class="profile-info">
          <h3 id="target-title">Sonia, 24</h3>
          <p id="target-loc">📍 Paris</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn-act btn-no" onclick="likeProfile(false)">❌</button>
        <button class="btn-act btn-yes" onclick="likeProfile(true)">❤️</button>
      </div>

      <button class="btn-logout" onclick="logout()">Se déconnecter</button>
    </div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('activeUser')) || null;
    let profiles = [
      { name: "Sonia", age: 24, city: "Paris", photo: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=600" },
      { name: "Clara", age: 27, city: "Lyon", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600" },
      { name: "Elena", age: 23, city: "Bordeaux", photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=600" }
    ];
    let currentIdx = 0;

    // Chargement dynamique de la photo de profil
    document.getElementById('photo-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('avatar-img').src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Géolocalisation GPS
    document.getElementById('btn-gps').addEventListener('click', function() {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
            const data = await res.json();
            document.getElementById('reg-ville').value = data.address.city || data.address.town || 'Paris';
          } catch(e) { document.getElementById('reg-ville').value = 'Paris'; }
        }, () => alert("Activez la géolocalisation sur votre appareil."));
      }
    });

    // Basculer entre Connexion et Inscription
    function toggleAuth(showRegister) {
      document.getElementById('login-form').style.display = showRegister ? 'none' : 'block';
      document.getElementById('register-form').style.display = showRegister ? 'block' : 'none';
      document.getElementById('auth-title').textContent = showRegister ? 'Créer votre compte' : 'Connexion à votre compte';
    }

    // Gestion Inscription
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = {
        prenom: document.getElementById('reg-prenom').value,
        age: document.getElementById('reg-age').value,
        ville: document.getElementById('reg-ville').value,
        genre: document.getElementById('reg-genre').value,
        likesLeft: document.getElementById('reg-genre').value === 'Homme' ? 10 : Infinity,
        photo: document.getElementById('avatar-img').src
      };

      // Sauvegarder dans la mémoire du navigateur
      localStorage.setItem('user_' + user.prenom.toLowerCase(), JSON.stringify(user));
      loginUser(user);
    });

    // Gestion Connexion
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const prenom = document.getElementById('login-prenom').value.trim().toLowerCase();
      const savedUser = localStorage.getItem('user_' + prenom);

      if (savedUser) {
        loginUser(JSON.parse(savedUser));
      } else {
        alert("Aucun compte trouvé avec ce prénom. Veuillez vous inscrire !");
        toggleAuth(true);
      }
    });

    function loginUser(user) {
      currentUser = user;
      localStorage.setItem('activeUser', JSON.stringify(user));

      // Notifications push
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      updateQuota();
      showCard();
    }

    function updateQuota() {
      const q = document.getElementById('quota-tag');
      q.style.display = 'block';
      if (currentUser.genre === 'Femme') {
        q.textContent = 'Likes : Illimités ♾️';
      } else {
        q.textContent = `Likes : ${currentUser.likesLeft}/10`;
      }
    }

    function showCard() {
      if (currentIdx >= profiles.length) {
        alert("Plus de profils disponibles aux alentours.");
        return;
      }
      const p = profiles[currentIdx];
      document.getElementById('target-img').src = p.photo;
      document.getElementById('target-title').textContent = `${p.name}, ${p.age}`;
      document.getElementById('target-loc').textContent = `📍 ${p.city}`;
    }

    function likeProfile(isLike) {
      if (isLike && currentUser.genre === 'Homme') {
        if (currentUser.likesLeft <= 0) {
          alert("Limite de 10 likes par jour atteinte !");
          return;
        }
        currentUser.likesLeft--;
        localStorage.setItem('user_' + currentUser.prenom.toLowerCase(), JSON.stringify(currentUser));
        localStorage.setItem('activeUser', JSON.stringify(currentUser));
        updateQuota();
      }

      if (isLike && Math.random() > 0.4) {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification("Nouveau Match ! ❤️", { body: `${profiles[currentIdx].name} vous a également liké !` });
        }
        alert(`Match ! ❤️ Vous avez matché avec ${profiles[currentIdx].name}`);
      }

      currentIdx++;
      showCard();
    }

    function logout() {
      localStorage.removeItem('activeUser');
      location.reload();
    }

    // Auto-connexion si déjà connecté
    if (currentUser) {
      loginUser(currentUser);
    }
  </script>
</body>
</html>
